[bf4hook]
ExternalIP=
ExternalPort=0

; 基础控制
InstallHooks=1
EnableControl=1
EnableAim=1
EnableFire=1
AllowBotTargets=1
; Hook 接管上限 1～128；实际生成人数由 PseudoPlayer.SpawnCount 设置。
ControlBotLimit=128
CaptureObjectives=1
VehicleBots=1
; 从 Game.MaxPlayerCount / Network.MaxClientCount 应用原生容量。
ServerCapacityFromConfig=1

; 导航和载具
; 无有效位移的脱困阈值，单位秒，至少 1。
StuckSeconds=1.0
; 寻路转向响应，单位秒，至少 0.1。
SteeringResponseSeconds=0.2
ObjectiveShare=0.80
ObjectiveStaleMs=2500
RoamerDepthWeight=0.65
VehicleSteeringSign=1
JetTurnSpeedKmh=313

BotFrontlineSpawn=1
BotSquadSpawn=1
BotAcceptRevive=1
BotMedicRevive=1
BotReviveWindowMs=6000
BotHotspotSupplies=1
BotSupplyCooldownMs=2500
BotInfiniteReserve=1
BotReserveFloor=1000
BotNativeDamage=1
BotLauncherSupport=1
BotClusterGrenades=1
BotGrenadeClearObjectives=1
BotInfiniteGrenades=1
BotGrenadeReserve=3
BotGrenadeCooldownMinMs=3000
BotGrenadeCooldownMaxMs=6000
BotGrenadeTeamGapMs=500

BotMatchChat=1
BotCasualChat=1
BotMatchChatDeathStreak=3
BotMatchChatTopRanks=3
BotMatchChatMinIntervalMs=5000
BotMatchChatMaxIntervalMs=8000
BotMatchChatPlayerCooldownMs=20000
BotMatchChatTeamCooldownMs=20000
BotMatchChatWarmupMs=20000
BotMatchChatReplyMinMs=1000
BotMatchChatReplyMaxMs=1800
BotMatchChatTicketGap=60
BotMatchChatTicketFraction=0.12

; 回合结束聊天
BotRoundChat=1
BotRoundChatMinMessages=15
BotRoundChatMaxMessages=18
BotRoundChatQuickMinMessages=12
BotRoundChatFirstDelayMs=1200
BotRoundChatMinGapMs=700
BotRoundChatMaxGapMs=1200
BotRoundChatTestWinner=0

; 真人聊天命令和计分板
; !setbot N 设置双方合计 0～128 人机，命令全局冷却 2 秒。
ChatCommands=1
; 真人名字白名单，以英文分号分隔；留空允许所有真人。
ChatCommandAdmins=
BotScoreboardPing=1
BotRandomRank=1

; 日志和轨迹采集
Probe=0
CaptureProbe=0
PerformanceLog=0
ProbeIntervalMs=5000
BulletProbe=0
PathDump=0
PathDumpIntervalMs=200
